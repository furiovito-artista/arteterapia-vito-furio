      - { name: descrizione_pagina, label: Descrizione per Google, type: text }
      - { name: nome, label: Nome nel logo, type: string }
      - { name: sottotitolo_brand, label: Sottotitolo nel logo, type: string }

      - { name: hero_etichetta, label: Apertura · Etichetta, type: string }
