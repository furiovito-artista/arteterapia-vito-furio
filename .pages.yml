      - { name: hero_testo, label: Apertura · Testo, type: text }
      - { name: hero_frase, label: Apertura · Frase, type: string }
      - { name: hero_immagine, label: Apertura · Fotografia, type: image }
      - { name: hero_alt, label: Apertura · Descrizione fotografia, type: string }

      - { name: menu_percorsi, label: Menu · Percorsi, type: string }
      - { name: menu_opportunita, label: Menu · Opportunità, type: string }
      - { name: menu_formazione, label: Menu · Formazione, type: string }
