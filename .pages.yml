  - name: percorsi
    label: Percorsi
    type: file
    path: data/percorsi.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: descrizione, label: Descrizione, type: text }
      - { name: icona, label: Simbolo, type: string }
      - { name: link_testo, label: Testo del pulsante, type: string }
      - { name: link_destinazione, label: Destinazione del pulsante, type: string }
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

  - name: destinatari
    label: Destinatari
    type: file
    path: data/destinatari.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: descrizione, label: Descrizione, type: text }
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

  - name: opportunita
    label: Opportunità
    type: file
    path: data/opportunita.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: descrizione, label: Descrizione, type: text }
      - { name: immagine, label: Fotografia, type: image }
      - { name: link_testo, label: Testo del collegamento, type: string }
      - { name: link_destinazione, label: Destinazione del collegamento, type: string }
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

  - name: formazione
    label: Formazione
    type: file
    path: data/formazione.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: descrizione, label: Descrizione, type: text }
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

  - name: galleria
    label: Galleria fotografica
    type: file
    path: data/galleria.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - { name: descrizione, label: Didascalia, type: text }
      - { name: immagine, label: Fotografia, type: image }
      - { name: testo_alternativo, label: Descrizione accessibile della fotografia, type: string }
      - { name: verticale, label: Fotografia verticale, type: boolean }
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

  - name: esperienza
    label: Esperienza professionale
    type: file
    path: data/esperienza.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: titolo, label: Titolo del riquadro, type: string, required: true }
      - name: voci
        label: Esperienze
        type: string
        list: true
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

  - name: faq
    label: Domande frequenti
    type: file
    path: data/faq.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: domanda, label: Domanda, type: string, required: true }
      - { name: risposta, label: Risposta, type: text, required: true }
      - { name: ordine, label: Ordine, type: number }
      - { name: mostra, label: Mostra nel sito, type: boolean }

settings:
  content:
    merge: true
  commit:
    identity: user
