      - { name: intro_3, label: Fascia iniziale · Riga 3, type: string }

      - { name: titolo_percorsi, label: Percorsi · Titolo, type: text }
      - { name: testo_percorsi, label: Percorsi · Testo, type: text }

      - { name: titolo_destinatari, label: Destinatari · Titolo, type: text }
      - { name: destinatari_immagine, label: Destinatari · Fotografia, type: image }
